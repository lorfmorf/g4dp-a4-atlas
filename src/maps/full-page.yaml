# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on src/pages/full_page_map.mdx: it fills the window under the site
# header, with zoom and reset buttons, a legend and a layer panel.
type: map
id: full-page
config:
  mapStyle: "/newstyle.json"
  center: [-73.99171, 40.718]
  zoom: 13.95

# Where the legend sits: top-left (default), top-right, bottom-left, bottom-right.
legend:
  position: bottom-left

layers:
  # Vector tiles from OpenFreeMap (free, no key): the same tiles the basemap
  # draws, here only their building shapes, in a colour of your own.
  # Starts switched off; tick it in the layer panel.
  - id: restaurant-inspections
    type: circle
    label: Restaurant inspections
    visible: false
    source:
      type: geojson
      url: "/data/restaurant_inspections.geojson"
    paint:
      circle-radius: 3
      circle-color: "#c0642f"
    legend: { label: Restaurant inspections, color: "#c0642f", shape: circle }

  - id: subway-lines
    type: line
    label: Subway lines
    visible: false
    source:
      type: geojson
      url: "/data/subway_lines.geojson"
    paint:
      line-color: "#2166ac"
      line-width: 2
    legend: { label: Subway lines, color: "#2166ac", shape: line }

  - id: subway-stations
    type: circle
    label: Subway stations
    visible: false
    source:
      type: geojson
      url: "/data/subway_stations.geojson"
    paint:
      circle-color: "#4caf50"
      circle-radius: 5
    legend: { label: Subway stations, color: "#4caf50", shape: circle}