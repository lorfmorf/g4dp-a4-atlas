# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# Turning layers on and off. Every layer with a `label:` gets a checkbox in
# the layer panel (top right). `visible: false` starts a layer switched off.
# Shown on src/pages/inline_maps.mdx.
type: map
id: layer-toggles
config:
  mapStyle: "https://tiles.openfreemap.org/styles/positron"
  center: [-73.9654, 40.7829]
  zoom: 13

layers:
  # A polygon written straight into the YAML (no data file needed).

  - id: restaurant-inspections
    type: circle
    label: Restaurant inspections
    visible: false
    source:
      type: geojson
      url: "/data/restaurant_inspections.geojson"
    paint:
      circle-radius: 3
      circle-color: "#c0642f"
    legend: { label: Restaurant inspections, color: "#c0642f", shape: circle }

  - id: subway-lines
    type: line
    label: Subway lines
    visible: false
    source:
      type: geojson
      url: "/data/subway_lines.geojson"
    paint:
      line-color: "#2166ac"
      line-width: 2
    legend: { label: Subway lines, color: "#2166ac", shape: line }

  - id: subway-stations
    type: circle
    label: Subway stations
    visible: false
    source:
      type: geojson
      url: "/data/subway_stations.geojson"
    paint:
      circle-color: "#4caf50"
      circle-radius: 5
    legend: { label: Subway stations, color: "#4caf50", shape: circle}